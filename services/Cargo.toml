[workspace]
members = [
    "shared",
    "sensor",
    "camera",
    "rf",
    "alert",
    "influx-writer",
    "worker",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13"
prost-types = "0.13"
async-nats = "0.36"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
