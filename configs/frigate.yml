mqtt:
  enabled: true
  host: localhost
  port: 1883

# go2rtc connects once to the axis camera and restreams to everything else.
# ffmpeg consumes the local restream; browser live view uses webrtc via port 8555.
# credentials are substituted by preStart sed before frigate reads this file.
go2rtc:
  streams:
    axis:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.0.30.116/axis-media/media.amp

detectors:
  default:
    type: cpu

cameras:
  axis:
    ffmpeg:
      # hwaccel_args: preset-vaapi  # disabled: intel iHD hwdownload fails for detect pipeline
      input_args: preset-rtsp-tcp
      inputs:
        # go2rtc restream on loopback — no direct connection to camera from ffmpeg
        - path: rtsp://127.0.0.1:8554/axis
          roles:
            - detect
            - record
    live:
      stream_name: axis  # use go2rtc for webrtc live view (sub-second latency)
    detect:
      width: 1920
      height: 1080
      fps: 5
      enabled: true

record:
  enabled: true
  retain:
    days: 7
    mode: all
  events:
    retain:
      default: 14
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14
